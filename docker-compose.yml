# Native build + run in Docker. Tokens come from the environment (each one is optional):
#   PowerShell: $env:GITHUB_TOKEN = gh auth token; $env:GITLAB_TOKEN = "glpat-..."; docker compose up --build
#   bash:       GITHUB_TOKEN=$(gh auth token) GITLAB_TOKEN=glpat-... docker compose up --build
# Self-managed GitLab: also set SCR_GITLAB_URL (default https://gitlab.com).
services:
  smart-code-review:
    build: .
    image: culmi/smart-code-review:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      SCR_GITLAB_URL: ${SCR_GITLAB_URL:-https://gitlab.com}
    volumes:
      # Same layout as ~/.smart-code-review when running locally; agents can read/write it here.
      - ./data:/data
