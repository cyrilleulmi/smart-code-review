# SmartCodeReview backend
quarkus.application.name=smart-code-review
quarkus.http.port=8080
# Local tool: only listen on localhost (the Docker image overrides this with 0.0.0.0)
quarkus.http.host=127.0.0.1
quarkus.banner.enabled=false

# Data directory (snapshots, analysis, marks). Env: SCR_DATA_DIR. Default: ~/.smart-code-review
# scr.data-dir=
# GitHub token. Env: GITHUB_TOKEN or GH_TOKEN; fallback: `gh auth token`
# scr.github.token=

quarkus.native.resources.includes=rules/*.json,data-dir/*
quarkus.log.category."dev.smartcodereview".level=INFO

# Angular dev server (ng serve) proxies /api to us; no CORS needed.
